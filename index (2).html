<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/font-awesome.css" />
  <link rel="stylesheet" href="css/bootstrap.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="images/favicon.png" />
  <title>Yavin Office Design</title>
</head>

<body>
  <!-- NAVBAR START -->
  <nav class="navbar navbar-expand-lg sticky-top py-5">
    <div class="container">

      <!-- Logo -->
      <a href="index.html" class="navbar-brand" data-aos="fade-right" data-aos-duration="800" data-aos-delay="200">
        <img src="images/logo.svg" alt="Yavin Office Logo" height="40">
      </a>

      <!-- Toggler Button -->
      <button class="navbar-toggler btn btn-light rounded-pill border-2 border-primary-subtle" type="button"
        data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" data-aos="fade-left" data-aos-duration="800"
        data-aos-delay="200">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Collapsible Links -->
       <div class="collapse navbar-collapse" id="navbarNavAltMarkup"></div>
    </div>
  </nav>
  <!-- NAVBAR END -->
  <!-- Bootstrap JS (Core) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
    integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
    crossorigin="anonymous"></script>

  <!-- FB JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>

  <!-- Custom JS -->
  <script src="script.js"></script>

  <!-- AOS JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script>
    AOS.init({
      duration: 800,
      easing: 'ease-in-out',
      offset: 150,
    });
  </script>

  <!-- Granim JS -->
  <script src="https://cdn.jsdelivr.net/npm/granim@2.0.0/dist/granim.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var granimInstance = new Granim({
        element: '#granim-canvas',
        direction: 'left-right',
        isPausedWhenNotInView: true,
        states: {
          "default-state": {
            gradients: [
              ['#d0e6ff', '#a1c4fd'],
              ['#c1f7d5', '#a4fbc4']
            ],
            transitionSpeed: 3000
          }
        }
      });
    });
  </script>

  <!-- LottieFiles JS -->
  <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>
</body>

</html>
